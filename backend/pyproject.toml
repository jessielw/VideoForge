[project]
name = "VideoForgeBackend"
version = "0.1.0"
description = "FastAPI backend for Video-Forge scaffold"
license = "MIT"
# readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.118.0",
    "numpy>=2.2.6",
    "pillow>=11.3.0",
    "pymediainfo>=7.0.1",
    "python-dotenv>=1.1.1",
    "uvicorn[standard]>=0.37.0",
    "vapoursynth>=72",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.9.6"]

[tool.ruff]
line-length = 88

[tool.basedpyright]
include = ["backend"]
typeCheckingMode = "standard" 
