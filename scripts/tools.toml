# Windows x64 runtime inventory shared by developer setup and portable releases.
# Pin every binary and notice. Add separate platform tables for future Linux provisioning.
schema = 1
platform = "windows-x64"

[[external]]
name = "VapourSynth / vspipe"
provides = ["vspipe"]
provider = "Python dependency: vapoursynth (uv.lock)"

[[external]]
name = "VapourSynth plugins and filter scripts"
provides = ["vs_plugins"]
provider = "vsplugins/manifest.toml, fetch_plugins.py and the filters extra"

[[external]]
name = "MediaInfo"
provides = []
provider = "Python dependency: pymediainfo (uv.lock), including its Windows library"

[[external]]
name = "Dolby Encoding Engine"
provides = ["dee"]
provider = "User supplied: tools/DEE/dee.exe and its license; required for DeeZy DDP / Atmos"

[[external]]
name = "Apple CoreAudioToolbox"
provides = []
provider = "User supplied: tools/qaac/QTfiles64/; required for qaac AAC encoding"

