[project]
name = "videoforge"
version = "0.1.0-beta.2"
description = "Encode and mux job queue in the browser: VapourSynth, x264/x265, audio, subtitles, MKV / MP4"
authors = [
    { name = "jessielw", email = "jessielw4049@gmail.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "apprise>=1.9.0",
    "autoqpf>=0.2.5",
    "fastapi>=0.143.0",
    "niquests>=3.21.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pymediainfo>=7.0.1",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
    "vapoursynth>=81",
]

[project.scripts]
videoforge = "videoforge:main"

[project.urls]
Homepage = "https://github.com/jessielw/VideoForge"
Documentation = "https://jessielw.github.io/VideoForge/"
Source = "https://github.com/jessielw/VideoForge"
Issues = "https://github.com/jessielw/VideoForge/issues"

# Profiles (the rules a job is planned with). A group's profile is its own
# package that adds an entry to this group.
[project.entry-points."videoforge.profiles"]
manual = "videoforge.profiles.manual:ManualProfile"

[project.optional-dependencies]
desktop = [
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
]
# Python filter scripts for VapourSynth scripts (the Docker image and the portable build have them). The
# single-file ones (havsfunc, mvsfunc) and the plugins come from vsplugins/manifest.toml.
filters = [
    "adjust>=0.1.0",
    "awsmfunc>=1.3.5",
    "dfttest2>=11.0.0",
    "vs-rekt>=1.0.0",
    "vsutil>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
docs = [
    "zensical>=0.0.71,<0.1.0",
]
dev = [
    "basedpyright>=1.40.2",
    "httpx>=0.28.1",  # fastapi.testclient
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["legacy", "frontend"]

[tool.ruff.lint]
# `select` replaces ruff's defaults rather than extending them, so "F"
# (pyflakes) is listed explicitly.
select = ["F", "I", "UP", "B", "S", "RUF100"]
# Running external tools (mkvmerge, x264, vspipe, ...) from argv lists is the
# app's job: S603/S607 would flag every one of them.
ignore = ["S603", "S607"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# pytest is built on `assert`.
"tests/**" = ["S101"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.poe.tasks]
docs = "zensical serve"
docs-build = "zensical build --clean --strict"
typecheck = "basedpyright"
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format-check = "ruff format . --check"
format-code = "ruff format ."
format.sequence = ["lint-fix", "format-code"]
