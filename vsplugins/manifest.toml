# The VapourSynth plugins VideoForge bundles: the Docker image builds them from these sources
# (vsplugins/Dockerfile, vsplugins/build.py) and scripts/fetch_plugins.py downloads their Windows builds.
# All are API 4 (VapourSynth R81 no longer loads API 3 plugins, which ruled out TDeintMod, EEDI2, CTMF,
# DFTTest, neo_f3kdb, RemapFrames and dubhater's nnedi3: dfttest2, vszip's Deband/RFS and znedi3 stand in).
#
# [[plugin]]
#   name, namespace (vs.core.<namespace>), repo, ref (a tag or a commit), license
#   build      meson | cmake | autotools (autogen.sh/autoreconf, configure, make) | make | zig
#              | cc (compile `sources` into one library)
#   subdir     where the build files are (default: the repo's top)
#   submodules true for all of the repo's submodules, or a list of their paths
#   before     shell commands run in the repo before the build (e.g. a library it links statically)
#   env        environment variables for the build
#   options    extra arguments for the configure step (meson setup, cmake, ./configure, make, zig build);
#              {vs_include} is VapourSynth's include folder
#   targets    for autotools: the make targets (default: all)
#   zig        for zig: the Zig version (the Dockerfile installs each)
#   variants   for zig: {suffix = cpu}, one build per CPU level in a folder with a manifest.vs, so VapourSynth
#              loads the best one the CPU runs ("" is the baseline)
#   sources    for cc: the files to compile (globs)
#   library    the built library's file name (a glob), when the build makes more than one
#   files      more files the plugin reads next to it (copied from the source tree)
#   win64      the Windows build: {url, sha256, files = {path in the plugin folder = path in the archive}}, or
#              a list of them; a download that isn't an archive is the file itself
#
# [[script]] is a Python filter script (one module: name, url, sha256, license) that scripts/fetch_plugins.py
# puts in site-packages (for the Docker image too), with `replace` = {old = new} applied to its text; the
# packaged ones (awsmfunc, vsutil, vs-rekt, adjust, dfttest2) are the `filters` extra in pyproject.toml.

# --- source filters -----------------------------------------------------------------------------------

[[plugin]]
name = "BestSource"
namespace = "bs"
repo = "https://github.com/vapoursynth/bestsource"
ref = "R22"
license = "MIT"
build = "meson"
options = ["-Denable_plugin=true"]
win64 = { url = "https://files.pythonhosted.org/packages/e1/01/8b65d43d73d6d3a5dab3aa79a65e98cf8fac33cfe24e94bdcad46ded390e/vapoursynth_bestsource-22-py3-none-win_amd64.whl", sha256 = "4dc2275d145128a2a86fa32efaab9fbab8e22582bfdf173b460f2ff33858c230", files = { "libbestsource.dll" = "vapoursynth/plugins/libbestsource.dll" } }

[[plugin]]
name = "L-SMASH-Works"
namespace = "lsmas"
repo = "https://github.com/HomeOfAviSynthPlusEvolution/L-SMASH-Works"
ref = "1310.0.0.0"
license = "ISC (L-SMASH-Works), LGPL-2.1+ (lwlibav)"
build = "cmake"
submodules = true
# Its own FFmpeg (a patched one: L-SMASH-Works doesn't build against FFmpeg 9 yet), linked in statically and
# kept to itself (-Bsymbolic, --exclude-libs) as upstream's Linux wheel does, next to the FFmpeg 9 the others use.
before = [
    "cd FFmpeg && ./configure --prefix=/build/lsmas-deps --disable-autodetect --disable-muxers --disable-avdevice --disable-encoders --disable-filters --disable-devices --disable-network --disable-programs --disable-doc --disable-debug --enable-gpl --enable-pic --enable-libdav1d --enable-zlib && make -j$(nproc) && make install",
]
env = { PKG_CONFIG_PATH = "/build/lsmas-deps/lib/pkgconfig:/usr/local/lib/pkgconfig" }
options = [
    "-DBUILD_AVS_PLUGIN=OFF", "-DENABLE_XML2=OFF", "-DENABLE_VPX=OFF", "-DENABLE_MFX=OFF",
    "-Ddav1d_USE_STATIC_LIBS=OFF", "-DZLIB_USE_STATIC_LIBS=OFF", "-DCMAKE_PREFIX_PATH=/build/lsmas-deps",
    "-DCMAKE_POSITION_INDEPENDENT_CODE=ON", "-DCMAKE_C_FLAGS=-fPIC", "-DCMAKE_CXX_FLAGS=-fPIC",
    "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-Bsymbolic -Wl,--exclude-libs,ALL",
    "-DCMAKE_MODULE_LINKER_FLAGS=-Wl,-Bsymbolic -Wl,--exclude-libs,ALL",
]
win64 = { url = "https://files.pythonhosted.org/packages/a2/4f/f5804dbeb6563486e1d72ce3e72cb9ae2c7201c6660112447f2e1c6f85ec/vapoursynth_lsmas-1310.0.0.0-py3-none-win_amd64.whl", sha256 = "8197e2c901ff7b9ac651a66819986bfd993767a0b656a8d11c8f5b53829d2f6b", files = { "LSMASHSource.dll" = "vapoursynth/plugins/LSMASHSource.dll" } }

[[plugin]]
name = "FFMS2"
namespace = "ffms2"
repo = "https://github.com/FFMS/ffms2"
# master (5.1.2): the 5.0 release predates FFmpeg 8 and 9
ref = "3af2ef2ae47bc30b64597c9e419e5b19c4bda7d8"
