# The Docker image's settings: tools on PATH (installed in the image), your own tools in /tools.
# Change paths on the Settings page (kept in /data), or mount a videoforge.local.toml next to this file
# (/app/videoforge.local.toml) to merge over it.
profile = "manual"

[tools]
mkvmerge = "mkvmerge"
x264 = "x264"
x265 = "x265"
svtav1 = "SvtAv1EncApp"
ffmpeg = "ffmpeg"
opusenc = "opusenc"
mp4box = "MP4Box"
deezy = "deezy"
truehdd = "truehdd"
dovi_tool = "dovi_tool"
hdr10plus_tool = "hdr10plus_tool"
# DEE and qaac aren't free to ship: the entrypoint puts a launcher on PATH for each one in /tools.
# Dolby Encoding Engine: the Linux build as /tools/dee/dee, or the Windows build as /tools/wine/dee/dee.exe
# (run under Wine), each with its license next to it.
dee = "dee"
# qaac: qaac64.exe and its QTfiles64 folder (Apple's CoreAudioToolbox) in /tools/wine/qaac, run under Wine.
# Without it AAC (qaac) shows as unavailable (ffmpeg's AAC is there).
qaac = "qaac"
# More VapourSynth plugins (.so) of your own; the image's (vsplugins/manifest.toml: BestSource, L-SMASH,
# FFMS2 and the common filters) are always loaded.
vs_plugins = "/tools/vs-plugins"

[pairing]
encode_suffixes = ["_job", "_out", "_new", ""]
encode_extensions = [".h264", ".264", ".avc", ".hevc", ".265", ".h265"]
scan_source_folder = true
staxrip_temp = true

[pipeline]
# Audio encodes a job runs at once beside its video encode (they start once the source is indexed);
# 0 encodes them one by one. The Settings page can change it.
parallel_audio = 2
# Delete a job's work folder (<source>_tmp: the index, the encodes, the log) once the job is done;
# its job records and log are copied to <data folder>/records first. The Settings page can change it.
delete_work_dir = false
# Process priority: idle, below_normal, normal, above_normal or high, as a nice value (raising one back
# needs CAP_SYS_NICE). The video encode (the encoder and the vspipe feeding it), and every other tool.
encoder_priority = "below_normal"
tool_priority = "normal"

[actions]
# Let the Settings page's command actions run. Off here: the web page has no login, so anyone who can
# reach the container could run anything in it. Turn it on in a videoforge.local.toml if only you can.
commands = false
