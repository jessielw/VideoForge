# Rules new jobs are planned with: "manual" (built in) or an installed profile's id.
# Machine-specific settings (tool paths, profile) can go in videoforge.local.toml
# next to this file; its tables are merged over these.
profile = "manual"

# Tool locations. Relative paths resolve against this file's folder.
# A bare name (e.g. "ffmpeg") is looked up on PATH.

[tools]
mkvmerge = "tools/MKVToolNix/mkvmerge.exe"
deezy = "tools/DeeZy/deezy.exe"
dee = "tools/DEE/dee.exe"
truehdd = "tools/truehdd/truehdd.exe"
qaac = "tools/qaac/qaac64.exe"
opusenc = "tools/opus-tools/opusenc.exe"
ffmpeg = "tools/ffmpeg/bin/ffmpeg.exe"
# ffprobe (an MP4 / TS source's timing) is found next to ffmpeg unless set.
x264 = "tools/x264/x264.exe"
x265 = "tools/x265/x265.exe"
# SVT-AV1 (StaxRip takes Patman86's builds of SvtAv1EncApp).
svtav1 = "tools/SvtAv1EncApp/SvtAv1EncApp.exe"
# MP4 output (GPAC). All free Windows tools come from scripts/fetch_tools.py.
mp4box = "tools/GPAC/mp4box.exe"
# Dolby Vision and HDR10+ metadata.
dovi_tool = "tools/dovi_tool/dovi_tool.exe"
hdr10plus_tool = "tools/hdr10plus_tool/hdr10plus_tool.exe"
# VapourSynth plugins (bestsource, lsmas, ffms2, filters). vspipe comes with the
# vapoursynth Python package; set `vspipe` here only to use another one.
vs_plugins = "tools/vs-plugins"

[pairing]
# StaxRip output stems are matched as "<source stem><suffix>" (e.g.
# "Show.S01E01_job.h264"); "" matches identical stems in different folders.
# TV episodes also match on their SxxEyy token.
encode_suffixes = ["_job", "_out", "_new", ""]
# Raw streams StaxRip writes when muxing is off. MKVs without audio also count.
encode_extensions = [".h264", ".264", ".avc", ".hevc", ".265", ".h265"]
# Also take SRTs next to the source and one folder down (e.g. subs/) that share
# its stem or SxxEyy token, on top of the subtitle files added to a job.
scan_source_folder = true
# Read <source>_temp (StaxRip): the job log for "still encoding", and
# a_qpf/qpf_chapters.txt for chapters when no chapter file was added.
staxrip_temp = true

[pipeline]
# Audio encodes a job runs at once beside its video encode (they start once the source is indexed);
# 0 encodes them one by one. The Settings page can change it.
parallel_audio = 2
# Delete a job's work folder (<source>_tmp: the index, the encodes, the log) once the job is done;
# its job records and log are copied to <data folder>/records first. The Settings page can change it.
delete_work_dir = false
# Process priority: idle, below_normal, normal, above_normal or high (a nice value on Linux, where raising
# one needs CAP_SYS_NICE). The video encode (x264 / x265 and the vspipe feeding it), and every other tool.
# The Settings page can change them; the Queue's toolbar changes the running job's.
encoder_priority = "below_normal"
tool_priority = "normal"

[actions]
# Let the Settings page's command actions run (a program after a job ends or the queue finishes).
# The web page has no login, so turn this off if anyone else can reach VideoForge.
commands = true
